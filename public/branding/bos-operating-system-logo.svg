<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc"><title id="title">B.O.S. — Bango Operating System</title><desc id="desc">High-contrast metallic B.O.S. wordmark over a blue digital globe on a transparent background.</desc><defs><linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#f8fbff"/><stop offset=".52" stop-color="#aeb9c8"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="#8b98aa"/></linearGradient><radialGradient id="dot"><stop offset="0" stop-color="#8ffbff"/><stop offset=".45" stop-color="#00d7ff"/><stop offset="1" stop-color="#006cff"/></radialGradient><linearGradient id="beam"><stop offset="0" stop-color="#008cff" stop-opacity="0"/><stop offset=".42" stop-color="#00bfff"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#00bfff"/><stop offset="1" stop-color="#008cff" stop-opacity="0"/></linearGradient><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="17" cy="17" r="7" fill="url(#dot)"/></pattern><radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="sphereFade"><rect width="1000" height="1000" fill="url(#fade)"/></mask><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g mask="url(#sphereFade)"><ellipse cx="500" cy="340" rx="360" ry="225" fill="url(#dots)"/><ellipse cx="500" cy="730" rx="330" ry="205" fill="url(#dots)" opacity=".92"/></g><text x="500" y="565" text-anchor="middle" fill="url(#metal)" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="250" font-weight="900" letter-spacing="4" filter="url(#soft)">B O S</text><g filter="url(#glow)"><rect x="318" y="504" width="38" height="38" rx="8" fill="#00a8ff" stroke="#56efff" stroke-width="3"/><rect x="642" y="504" width="38" height="38" rx="8" fill="#00a8ff" stroke="#56efff" stroke-width="3"/><rect x="916" y="504" width="38" height="38" rx="8" fill="#00a8ff" stroke="#56efff" stroke-width="3"/></g><text x="500" y="657" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="47" font-weight="600" letter-spacing="15">BANGO OPERATING SYSTEM</text><rect x="120" y="700" width="760" height="3" rx="1.5" fill="url(#beam)" filter="url(#glow)"/></svg>