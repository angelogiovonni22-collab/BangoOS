name: Blueprint Source Network Dimension Endpoint Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Source-network dimension endpoint diagnostic
        run: npx -y tsx lib/blueprints/engine/source-network-dimension-endpoint-diagnostic.contract.test.ts
