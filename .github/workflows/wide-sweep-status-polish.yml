name: Wide Sweep Status Polish

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: write

jobs:
  polish:
    if: contains(github.event.head_commit.message, 'Run wide sweep status polish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
          fetch-depth: 0
      - name: Humanize mobile field shift status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/crews/mobile-field-operations-workspace.tsx')
          s = p.read_text()
          old = 'Shift status: {selectedCrew?.shiftStatus || "off_duty"}'
          new = 'Shift status: {(selectedCrew?.shiftStatus || "off_duty").replaceAll("_", " ").replace(/\\b\\w/g, (letter) => letter.toUpperCase())}'
          if old not in s:
              raise SystemExit('target shift status expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/crews/mobile-field-operations-workspace.tsx
          git commit -m "Humanize mobile field shift status [skip ci]"
          git push origin HEAD:fix/production-wide-sweep
