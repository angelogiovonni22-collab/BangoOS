name: Patch Orion Read Evidence

on:
  push:
    branches:
      - feat/orion-safe-read-evidence-20260905
    paths:
      - ".github/workflows/patch-orion-read-evidence.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-safe-read-evidence-20260905
          fetch-depth: 0
      - run: python scripts/patch-orion-read-evidence.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/autonomy/safe-read-executor.ts
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Return bounded evidence from Orion safe reads"
            git push origin HEAD:feat/orion-safe-read-evidence-20260905
          fi
