name: Payroll Source Time Integrity

on:
  pull_request:
    paths:
      - "supabase/migrations/*payroll*"
      - "scripts/test-payroll-time-claims.mjs"
      - ".github/workflows/payroll-time-claims.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*payroll*"
      - "scripts/test-payroll-time-claims.mjs"
      - ".github/workflows/payroll-time-claims.yml"

permissions:
  contents: read

jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated PostgreSQL runtime
        run: |
          mkdir -p "$RUNNER_TEMP/payroll-postgres"
          npm pack @electric-sql/pglite@0.3.14 --pack-destination "$RUNNER_TEMP/payroll-postgres"
          tar -xzf "$RUNNER_TEMP/payroll-postgres/electric-sql-pglite-0.3.14.tgz" -C "$RUNNER_TEMP/payroll-postgres"
      - name: Verify payroll source integrity and void recovery
        run: node scripts/test-payroll-time-claims.mjs "$RUNNER_TEMP/payroll-postgres/package/dist/index.js" supabase/migrations/20261007223036_audit_payroll_project_cost_snapshots.sql supabase/migrations/20261007223901_audit_payroll_financial_cost_totals.sql
