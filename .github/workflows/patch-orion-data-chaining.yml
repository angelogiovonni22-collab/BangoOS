name: Patch Orion Data Chaining

on:
  push:
    branches:
      - feat/orion-autonomy-data-chaining-20260905
    paths:
      - ".github/workflows/patch-orion-data-chaining.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-autonomy-data-chaining-20260905
          fetch-depth: 0
      - name: Apply Orion data-chaining patch
        run: python scripts/patch-orion-data-chaining.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/orion/realtime/session/route.ts
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Teach Orion Realtime to chain verified read outputs"
            git push origin HEAD:feat/orion-autonomy-data-chaining-20260905
          fi
