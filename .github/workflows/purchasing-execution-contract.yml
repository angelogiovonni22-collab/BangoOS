name: Purchasing Execution Contract

on:
  pull_request:
    paths:
      - "lib/materials/purchasing-execution.ts"
      - "lib/materials/purchasing-execution.contract.test.ts"
      - "app/(app)/materials/procurement/**"
      - ".github/workflows/purchasing-execution-contract.yml"

jobs:
  purchasing-execution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/materials/purchasing-execution.contract.test.ts
