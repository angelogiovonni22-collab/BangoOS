name: Subscription Billing Lifecycle

on:
  pull_request:
    paths:
      - "app/api/billing/**"
      - "app/api/stripe/**"
      - "app/(app)/settings/billing/**"
      - "lib/billing/**"
      - "supabase/migrations/*stripe_subscription_billing*"
      - ".github/workflows/subscription-billing.yml"
  push:
    branches: [main]
    paths:
      - "app/api/billing/**"
      - "app/api/stripe/**"
      - "app/(app)/settings/billing/**"
      - "lib/billing/**"
      - "supabase/migrations/*stripe_subscription_billing*"
      - ".github/workflows/subscription-billing.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/billing/subscription-billing.contract.test.ts
