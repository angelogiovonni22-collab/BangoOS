name: Refresh Next Lock

on:
  push:
    branches:
      - feat/blueprint-engine-annotation-filtering

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/blueprint-engine-annotation-filtering

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh Next.js lock entry
        run: npm install next@16.3.4 --save-exact --package-lock-only --ignore-scripts

      - name: Commit lockfile refresh
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh lockfile for Next.js security patch"
          git push origin HEAD:feat/blueprint-engine-annotation-filtering
