name: Patch Orion Realtime Safe Sequences

on:
  push:
    branches:
      - feat/orion-realtime-safe-sequences-20260904
    paths:
      - ".github/workflows/patch-orion-realtime-safe-sequences.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-realtime-safe-sequences-20260904
          fetch-depth: 0
      - name: Apply safe-sequence patch
        run: python scripts/patch-orion-realtime-safe-sequences.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/orion/realtime/session/route.ts lib/orion/realtime/tool-bridge.ts
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Wire Orion safe read sequences into Realtime"
            git push origin HEAD:feat/orion-realtime-safe-sequences-20260904
          fi
