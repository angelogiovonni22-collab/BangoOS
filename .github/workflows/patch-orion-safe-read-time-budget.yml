name: Patch Orion Safe Read Time Budget

on:
  push:
    branches:
      - feat/orion-safe-read-time-budget-20260905
    paths:
      - scripts/patch-orion-safe-read-time-budget.py
      - .github/workflows/patch-orion-safe-read-time-budget.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-safe-read-time-budget-20260905
      - run: python scripts/patch-orion-safe-read-time-budget.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/autonomy/safe-read-executor.ts lib/orion/autonomy/orion-safe-read-time-budget.contract.test.ts
          git diff --cached --quiet || git commit -m "Bound Orion safe-read sequence time"
          git push
