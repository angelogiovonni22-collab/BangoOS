name: Patch Orion Safe Read Continuation

on:
  push:
    branches:
      - feat/orion-safe-read-continuation-20260905
    paths:
      - scripts/patch-orion-safe-read-continuation.py
      - .github/workflows/patch-orion-safe-read-continuation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-safe-read-continuation-20260905
      - run: python scripts/patch-orion-safe-read-continuation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/autonomy/safe-read-executor.ts app/api/orion/autonomy/execute-safe-read/route.ts lib/orion/realtime/tool-bridge.ts app/api/orion/realtime/session/route.ts lib/orion/autonomy/orion-safe-read-continuation.contract.test.ts
          git diff --cached --quiet || git commit -m "Resume Orion safe reads from encrypted continuation"
          git push
