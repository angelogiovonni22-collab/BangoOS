name: Blueprint Review Diagnostic

on:
  push:
    branches:
      - feat/blueprint-engine-review-workspace

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Graph review contract
        run: npx -y tsx components/plans/blueprint-graph-review.contract.test.ts
      - name: Blueprint aggregate contract
        run: npx -y tsx lib/blueprints/automatic-3d.contract.test.ts
      - name: Repository lint
        run: npm run lint
      - name: Production build
        run: npm run build
