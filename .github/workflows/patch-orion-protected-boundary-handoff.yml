name: Patch Orion Protected Boundary Handoff

on:
  push:
    branches:
      - feat/orion-protected-boundary-handoff-20260905
    paths:
      - ".github/workflows/patch-orion-protected-boundary-handoff.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-protected-boundary-handoff-20260905
          fetch-depth: 0
      - name: Apply protected-boundary handoff patch
        run: python scripts/patch-orion-protected-boundary-handoff.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/realtime/tool-bridge.ts app/api/orion/realtime/session/route.ts .github/workflows/orion-autonomy.yml
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Wire protected Orion boundary handoff into Realtime"
            git push origin HEAD:feat/orion-protected-boundary-handoff-20260905
          fi
