name: Adaptive BOS Configuration

on:
  pull_request:
    paths:
      - "lib/adaptive-bos/**"
      - "app/api/adaptive-bos/**"
      - "app/(app)/layout.tsx"
      - "app/(app)/app-shell.tsx"
      - "app/(app)/estimates/**"
      - "components/estimates/**"
      - "app/(app)/customers/**"
      - "components/customers/**"
      - "app/(app)/projects/**"
      - "components/projects/**"
      - "app/(app)/materials/**"
      - "components/materials/**"
      - "app/(app)/vendors/**"
      - "components/vendors/**"
      - "app/(app)/employees/**"
      - "components/employees/**"
      - "app/(app)/equipment/**"
      - "components/equipment/**"
      - "app/(app)/settings/operating-profile/**"
      - "app/(app)/settings/page.tsx"
      - "supabase/migrations/*adaptive_bos*"
      - ".github/workflows/adaptive-bos.yml"
  push:
    branches: [main]
    paths:
      - "lib/adaptive-bos/**"
      - "app/api/adaptive-bos/**"
      - "app/(app)/layout.tsx"
      - "app/(app)/app-shell.tsx"
      - "app/(app)/estimates/**"
      - "components/estimates/**"
      - "app/(app)/customers/**"
      - "components/customers/**"
      - "app/(app)/projects/**"
      - "components/projects/**"
      - "app/(app)/materials/**"
      - "components/materials/**"
      - "app/(app)/vendors/**"
      - "components/vendors/**"
      - "app/(app)/employees/**"
      - "components/employees/**"
      - "app/(app)/equipment/**"
      - "components/equipment/**"
      - "app/(app)/settings/operating-profile/**"
      - "app/(app)/settings/page.tsx"
      - "supabase/migrations/*adaptive_bos*"
      - ".github/workflows/adaptive-bos.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/adaptive-bos/adaptive-bos.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/operating-profile-ui.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/runtime-provider.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/runtime-navigation.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/database-template-runtime.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/estimate-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/customer-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/project-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/materials-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/vendor-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/workforce-surface-terminology.contract.test.ts
      - run: npx -y tsx lib/adaptive-bos/equipment-surface-terminology.contract.test.ts
