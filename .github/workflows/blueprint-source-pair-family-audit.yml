name: Blueprint Source Pair Family Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preserve source pair families
        run: npx -y tsx lib/blueprints/engine/source-wall-pair-consolidator.contract.test.ts
      - name: Source pair family agreement
        run: npx -y tsx lib/blueprints/engine/source-pair-family-agreement-diagnostic.contract.test.ts
      - name: Source pair coordinate offset diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-coordinate-offset-diagnostic.contract.test.ts
      - name: Complete-link family split diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-complete-link-split-diagnostic.contract.test.ts
      - name: Raster pairing gap diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-pairing-gap-diagnostic.contract.test.ts
      - name: Raster pairing conflict provenance diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-conflict-diagnostic.contract.test.ts
      - name: Isolated raster pair replacement simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-isolated-replacement-simulation.contract.test.ts
      - name: No-match raster stage diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-stage-gap-diagnostic.contract.test.ts
      - name: Raster de-duplication gap diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-dedupe-gap-diagnostic.contract.test.ts
      - name: Pair-builder consistency diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-pair-builder-consistency-diagnostic.contract.test.ts
      - name: Pair-builder consistency route safety
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-pair-builder-consistency-route.contract.test.ts
      - name: Pair-builder consistency compact endpoint
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-pair-builder-consistency-endpoint.contract.test.ts
      - name: Unexpected post-run raster gap diagnostic
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-unexpected-post-run-gap-diagnostic.contract.test.ts
      - name: Unexpected post-run raster gap safety
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-unexpected-post-run-gap-route.contract.test.ts
      - name: Unexpected post-run raster gap endpoint
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-unexpected-post-run-gap-endpoint.contract.test.ts
      - name: Raster min-run parity simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-minrun-simulation.contract.test.ts
      - name: Raster run parity simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-run-parity-simulation.contract.test.ts
      - name: Raster de-duplication preservation simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-dedupe-preservation-simulation.contract.test.ts
      - name: Targeted raster de-duplication collision simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-targeted-dedupe-simulation.contract.test.ts
      - name: Targeted de-duplication family isolation route
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-targeted-dedupe-family-isolation-route.contract.test.ts
      - name: Targeted de-duplication full-fidelity route
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-targeted-dedupe-fidelity-route.contract.test.ts
      - name: Source-backed raster short-run simulation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-targeted-shortrun-simulation.contract.test.ts
      - name: Source-backed short-run fidelity simulation
        run: npx -y tsx lib/blueprints/engine/source-backed-shortrun-fidelity-simulation.contract.test.ts
      - name: Source-backed short-run family isolation
        run: npx -y tsx lib/blueprints/engine/source-pair-raster-family-isolation-simulation.contract.test.ts
      - name: Source-backed short-run family isolation route
        run: npx -y tsx lib/blueprints/engine/source-backed-shortrun-family-isolation-route.contract.test.ts
