name: Wide Sweep Apply Import Fix

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run wide sweep import fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
          fetch-depth: 0
      - name: Repair generated helper imports
        run: python3 scripts/fix-nested-link-buttons.py
      - name: Validate and commit fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          if git diff --cached --quiet; then
            echo "No import fixes required."
            exit 0
          fi
          git commit -m "Repair interaction helper imports [skip ci]"
          git push origin HEAD:fix/production-wide-sweep
