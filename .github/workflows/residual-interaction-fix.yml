name: Residual Interaction Fix

on:
  push:
    branches:
      - fix/production-wide-residual-controls

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run residual interaction fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-residual-controls
          fetch-depth: 0
      - name: Replace nested navigation controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots=[Path('app'),Path('components')]
          pattern=re.compile(r'<Link(?P<linkattrs>[^>]*)>\s*<IconButton\s+icon=\{(?P<icon><[^>]+/>)\}\s+label=(?P<label>"[^"]*"|\{[^}]+\})\s+variant="(?P<variant>[^"]+)"\s+size="(?P<size>[^"]+)"\s*/>\s*</Link>',re.S)
          ui_import=re.compile(r'import\s*\{(?P<names>[^}]*)\}\s*from\s*["\']@/components/ui["\'];',re.S)

          def add_ui_name(text,name):
              m=ui_import.search(text)
              if not m:return text
              names=[x.strip() for x in m.group('names').split(',') if x.strip()]
              if name not in names:names.append(name)
              replacement='import {\n  '+',\n  '.join(names)+',\n} from "@/components/ui";'
              return text[:m.start()]+replacement+text[m.end():]

          changed=[]
          for root in roots:
              for p in root.rglob('*.tsx'):
                  s=p.read_text()
                  def repl(m):
                      return f'<IconLink{m.group("linkattrs")} icon={{{m.group("icon")}}} label={m.group("label")} variant="{m.group("variant")}" size="{m.group("size")}" />'
                  n,count=pattern.subn(repl,s)
                  if count:
                      n=add_ui_name(n,'IconLink')
                      if '<IconButton' not in n:
                          n=re.sub(r'\bIconButton,?\s*','',n)
                      if '<Link' not in n:
                          n=re.sub(r'import Link from "next/link";\n','',n)
                      p.write_text(n)
                      changed.append((str(p),count))

          p=Path('components/projects/workspace/project-trade-partners-workspace.tsx')
          s=p.read_text()
          old='<Link href={`/vendors/${assignment.vendorId}`}><Button type="button" variant="outline" className="w-full">View Trade Partner<ArrowUpRight size={14} /></Button></Link>'
          new='<Link href={`/vendors/${assignment.vendorId}`} className={`${getButtonClassName({ variant: "outline" })} w-full`}>View Trade Partner<ArrowUpRight size={14} /></Link>'
          if old in s:
              s=s.replace(old,new)
              if 'getButtonClassName' not in s.split('\n',30)[0:30]:
                  s=add_ui_name(s,'getButtonClassName')
              p.write_text(s)
              changed.append((str(p),1))

          for row in changed: print(*row)
          print('changed files',len(changed))
          PY
      - name: Verify no immediate Link interactive nesting remains
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pat=re.compile(r'<Link\b[^>]*>\s*<(Button|IconButton)\b',re.S)
          found=[]
          for root in (Path('app'),Path('components')):
              for p in root.rglob('*.tsx'):
                  s=p.read_text()
                  if pat.search(s):found.append(str(p))
          if found:
              print('\n'.join(found))
              raise SystemExit(1)
          print('No immediate Link > Button/IconButton nesting remains')
          PY
      - name: Commit fixes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Fix residual nested navigation controls [skip ci]" || true
          git push origin HEAD:fix/production-wide-residual-controls
