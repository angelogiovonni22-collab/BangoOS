name: Orion Autonomy Guardrails

on:
  pull_request:
    paths:
      - "lib/orion/autonomy/**"
      - "app/api/orion/autonomy/**"
      - "app/api/orion/realtime/tool/route.ts"
      - "app/api/orion/realtime/session/route.ts"
      - "lib/orion/realtime/tool-bridge.ts"
      - "lib/orion/operator/browser.ts"
      - ".github/workflows/orion-autonomy.yml"
  push:
    branches: [main]
    paths:
      - "lib/orion/autonomy/**"
      - "app/api/orion/autonomy/**"
      - "app/api/orion/realtime/tool/route.ts"
      - "app/api/orion/realtime/session/route.ts"
      - "lib/orion/realtime/tool-bridge.ts"
      - "lib/orion/operator/browser.ts"
      - ".github/workflows/orion-autonomy.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/orion/autonomy/orion-autonomy.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-autonomy-planner.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-autonomy-plan-request.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-step-references.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-protected-boundary-handoff.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-read-result-verifier.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-read-evidence.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-parallel-safe-reads.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-safe-read-executor.contract.test.ts
      - run: npx -y tsx lib/orion/autonomy/orion-realtime-safe-sequence.contract.test.ts
