name: Blueprint Engine Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native PDF vector fidelity
        run: npx -y tsx lib/blueprints/engine/pdf-vector-fidelity.contract.test.ts

      - name: Architectural primitive classifier
        run: npx -y tsx lib/blueprints/engine/primitive-classifier.contract.test.ts

      - name: Explicit wall system builder
        run: npx -y tsx lib/blueprints/engine/wall-system-builder.contract.test.ts

      - name: Global wall constraints
        run: npx -y tsx lib/blueprints/engine/global-constraint-solver.contract.test.ts

      - name: Vector-first candidate benchmark
        run: npx -y tsx lib/blueprints/engine/vector-first-benchmark.contract.test.ts

      - name: Raster evidence benchmark
        run: npx -y tsx lib/blueprints/engine/raster-evidence-benchmark.contract.test.ts

      - name: Raster structural selector
        run: npx -y tsx lib/blueprints/engine/raster-structural-selector.contract.test.ts

      - name: Raster sheet frame exclusion
        run: npx -y tsx lib/blueprints/engine/raster-sheet-frame.contract.test.ts

      - name: Source pixel overlay
        run: npx -y tsx lib/blueprints/engine/source-pixel-overlay.contract.test.ts

      - name: Raster dimension evidence association
        run: npx -y tsx lib/blueprints/engine/raster-dimension-evidence-associator.contract.test.ts

      - name: Global dimension boundary diagnostic
        run: npx -y tsx lib/blueprints/engine/global-dimension-boundary-diagnostic.contract.test.ts

      - name: Source wall pair consolidator
        run: npx -y tsx lib/blueprints/engine/source-wall-pair-consolidator.contract.test.ts

      - name: Source wall network selector
        run: npx -y tsx lib/blueprints/engine/source-wall-network-selector.contract.test.ts

      - name: Base parsing and geometry
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts base

      - name: Mitchell benchmark
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts benchmark

      - name: Mitchell topology accuracy
        if: always()
        run: npx -y tsx lib/blueprints/engine/mitchell-topology-accuracy.contract.test.ts

      - name: Source alignment fidelity
        if: always()
        run: npx -y tsx lib/blueprints/engine/source-alignment.contract.test.ts

      - name: Source dimension overlay
        if: always()
        run: npx -y tsx components/plans/blueprint-graph-review.contract.test.ts

      - name: Raster connected-wing selection
        if: always()
        run: npx -y tsx lib/blueprints/engine/raster-structural-cluster.contract.test.ts

      - name: Semantic support bounds
        if: always()
        run: npx -y tsx lib/blueprints/engine/semantic-support-bounds.contract.test.ts

      - name: Production dimension reconciliation
        if: always()
        run: npx -y tsx lib/blueprints/engine/production-hardening.contract.test.ts

      - name: Validation topology separation
        if: always()
        run: npx -y tsx lib/blueprints/engine/validation-topology-separation.contract.test.ts

      - name: Room-aware exterior classification
        if: always()
        run: npx -y tsx lib/blueprints/engine/exterior-classifier.contract.test.ts

      - name: Near-collinear wall gap repair
        if: always()
        run: npx -y tsx lib/blueprints/engine/near-collinear-gap-repair.contract.test.ts

      - name: Opening detection
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts openings

      - name: Dimension association
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts dimension

      - name: IFC serialization
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts ifc

      - name: Persisted corrections
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts corrections

      - name: Rectangle rejection
        if: always()
        run: npx -y tsx lib/blueprints/engine/engine-section-diagnostic.ts rectangle
