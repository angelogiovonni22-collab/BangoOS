name: Blueprint Engine Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Blueprint foundation contract
        run: npx -y tsx components/plans/blueprints-foundation.contract.test.ts

      - name: Blueprint release contract
        if: always()
        run: npx -y tsx components/plans/blueprints-release.contract.test.ts

      - name: Blueprint operations contract
        if: always()
        run: npx -y tsx lib/blueprints/operations.contract.test.ts

      - name: Automatic Blueprint-to-3D contract
        if: always()
        run: npx -y tsx lib/blueprints/automatic-3d.contract.test.ts

      - name: Build
        if: always()
        run: npm run build
