name: Build exact B.O.S. logo asset

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/exact-transparent-bos-logo

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct exact transparent PNG
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          let base64 = '';
          for (let i = 1; i <= 4; i += 1) {
            const path = `src/lib/branding/bos-logo-data-${i}.ts`;
            const source = fs.readFileSync(path, 'utf8');
            const match = source.match(/=\s*"([A-Za-z0-9+/=]+)";/);
            if (!match) throw new Error(`Unable to parse ${path}`);
            base64 += match[1];
          }
          const bytes = Buffer.from(base64, 'base64');
          if (bytes.length !== 25691) throw new Error(`Unexpected logo size: ${bytes.length}`);
          if (bytes.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a') throw new Error('Reconstructed asset is not a PNG');
          fs.mkdirSync('public/branding', { recursive: true });
          fs.writeFileSync('public/branding/bos-operating-system-logo.png', bytes);
          console.log(`Wrote ${bytes.length} bytes`);
          NODE
      - name: Commit reconstructed asset when needed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- public/branding/bos-operating-system-logo.png)" ]; then
            echo 'Logo asset already matches.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/branding/bos-operating-system-logo.png
          git commit -m 'Install exact transparent B.O.S. logo [logo-built]'
          git push origin HEAD:codex/exact-transparent-bos-logo
