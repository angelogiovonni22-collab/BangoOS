name: Blueprint Witness Diagnostic

on:
  push:
    branches:
      - feat/blueprint-engine-witness-filtering

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wall detector contract
        run: npx -y tsx lib/blueprints/engine/wall-detector.contract.test.ts
      - name: Room tracing contract
        run: npx -y tsx lib/blueprints/engine/room-tracing.contract.test.ts
      - name: Blueprint aggregate contract
        run: npx -y tsx lib/blueprints/automatic-3d.contract.test.ts
