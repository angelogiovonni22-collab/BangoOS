name: Patch Orion Parallel Safe Reads

on:
  push:
    branches:
      - feat/orion-parallel-safe-reads-20260905
    paths:
      - scripts/patch-orion-parallel-safe-reads.py
      - .github/workflows/patch-orion-parallel-safe-reads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-parallel-safe-reads-20260905
      - run: python scripts/patch-orion-parallel-safe-reads.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/autonomy/safe-read-executor.ts lib/orion/autonomy/orion-parallel-safe-reads.contract.test.ts .github/workflows/orion-autonomy.yml
          git diff --cached --quiet || git commit -m "Parallelize independent Orion safe reads"
          git push
