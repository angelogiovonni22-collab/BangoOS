name: B.O.S. Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bos-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify application and dependency health
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://bango-os.vercel.app/api/health)"
          node -e 'const value=JSON.parse(process.argv[1]); if(value.status!=="healthy") process.exit(1); for (const name of ["application","database","storage"]) if(value.checks?.[name]?.status!=="pass") process.exit(1)' "$response"

      - name: Verify production security headers
        run: |
          headers="$(curl --fail --silent --show-error --head --max-time 20 https://bango-os.vercel.app/login | tr -d '\r')"
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff$'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY$'
          printf '%s\n' "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin$'
          printf '%s\n' "$headers" | grep -qi "^content-security-policy: frame-ancestors 'none'$"
          printf '%s\n' "$headers" | grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains$'

      - name: Verify anonymous commercial entry
        run: |
          root_headers="$(curl --fail --silent --show-error --head --max-time 20 https://bango-os.vercel.app/ | tr -d '\r')"
          curl --fail --silent --show-error --max-time 20 --dump-header /tmp/bos-entry-headers --output /tmp/bos-entry-body https://bango-os.vercel.app/app-entry
          entry_headers="$(tr -d '\r' < /tmp/bos-entry-headers)"
          printf '%s\n' "$root_headers" | grep -Eqi '^location: (https://bango-os\.vercel\.app)?/app-entry/?$'
          # App Router can stream its redirect after the loading boundary (HTTP 200).
          if ! printf '%s\n' "$entry_headers" | grep -Eqi '^location: (https://bango-os\.vercel\.app)?/login/?

      - name: Verify developer diagnostic remains unavailable
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://bango-os.vercel.app/supabase-test)" = "404"
; then
            grep -Eq '<meta id="__next-page-redirect" http-equiv="refresh" content="[01];url=/login"/>' /tmp/bos-entry-body
          fi

      - name: Verify developer diagnostic remains unavailable
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://bango-os.vercel.app/supabase-test)" = "404"
