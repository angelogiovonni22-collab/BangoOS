name: Commercial Launch Security

on:
  pull_request:
    paths:
      - "lib/security/**"
      - "lib/blueprints/plan-package-security.contract.test.ts"
      - "supabase/migrations/*commercial_launch*"
      - ".github/workflows/commercial-launch-security.yml"
  push:
    branches: [main]
    paths:
      - "lib/security/**"
      - "lib/blueprints/plan-package-security.contract.test.ts"
      - "supabase/migrations/*commercial_launch*"
      - ".github/workflows/commercial-launch-security.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/security/commercial-launch-rpc-security.contract.test.ts
      - run: npx -y tsx lib/security/commercial-launch-entry-and-authenticated-rpc.contract.test.ts
      - run: npx -y tsx lib/security/commercial-launch-data-api-hardening.contract.test.ts
      - run: npx -y tsx lib/blueprints/plan-package-security.contract.test.ts
