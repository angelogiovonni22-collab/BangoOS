name: Password Security

on:
  pull_request:
    paths:
      - "lib/security/password-breach.ts"
      - "lib/security/password-breach.contract.test.ts"
      - "app/api/security/password-check/**"
      - "app/signup/page.tsx"
      - "app/(app)/partner/welcome/page.tsx"
      - "locales/*/auth.json"
      - ".github/workflows/password-security.yml"
  push:
    branches: [main]
    paths:
      - "lib/security/password-breach.ts"
      - "lib/security/password-breach.contract.test.ts"
      - "app/api/security/password-check/**"
      - "app/signup/page.tsx"
      - "app/(app)/partner/welcome/page.tsx"
      - "locales/*/auth.json"
      - ".github/workflows/password-security.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -y tsx lib/security/password-breach.contract.test.ts
