name: Wide Sweep CI Polish

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: write

jobs:
  polish:
    if: contains(github.event.head_commit.message, 'Run wide sweep CI polish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
          fetch-depth: 0
      - name: Add interaction integrity gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/check.yml')
          s = p.read_text()
          marker = '      - name: Run repository checks\n        run: npm run check\n'
          insert = '      - name: Run navigation interaction integrity regression\n        run: python3 scripts/fix-nested-link-buttons.py && git diff --exit-code -- app components\n\n'
          if insert in s:
              raise SystemExit(0)
          if marker not in s:
              raise SystemExit('repository checks marker not found')
          p.write_text(s.replace(marker, insert + marker, 1))
          PY
      - name: Commit gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/check.yml
          git commit -m "Guard navigation interaction semantics [skip ci]"
          git push origin HEAD:fix/production-wide-sweep
