name: Wide Sweep Fast Diagnostic

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run wide sweep fast diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print lint typecheck and test diagnostics
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.txt 2>&1
          lint_code=$?
          npm run typecheck > /tmp/typecheck.txt 2>&1
          typecheck_code=$?
          timeout 150s node scripts/run-tests.cjs > /tmp/tests.txt 2>&1
          tests_code=$?
          echo "LINT_EXIT_CODE=$lint_code"
          tail -n 120 /tmp/lint.txt
          echo "TYPECHECK_EXIT_CODE=$typecheck_code"
          tail -n 160 /tmp/typecheck.txt
          echo "TESTS_EXIT_CODE=$tests_code"
          tail -n 240 /tmp/tests.txt
          exit 0
