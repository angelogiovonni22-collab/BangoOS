name: Wide Sweep Fast Diagnostic

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run wide sweep fast diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint and build
        shell: bash
        run: |
          mkdir -p .diagnostics
          set +e
          npm run lint > .diagnostics/lint.txt 2>&1
          lint_code=$?
          npm run build > .diagnostics/build.txt 2>&1
          build_code=$?
          {
            echo "LINT_EXIT_CODE=$lint_code"
            tail -n 120 .diagnostics/lint.txt
            echo ""
            echo "BUILD_EXIT_CODE=$build_code"
            tail -n 180 .diagnostics/build.txt
          } > .diagnostics/wide-sweep-fast.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/wide-sweep-fast.txt
          git commit -m "Capture wide sweep fast diagnostic [skip ci]" || true
          git push origin HEAD:fix/production-wide-sweep
          exit 0
