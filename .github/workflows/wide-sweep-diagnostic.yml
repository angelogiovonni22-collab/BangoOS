name: Wide Sweep Diagnostic

on:
  push:
    branches:
      - fix/production-wide-sweep

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run wide sweep diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-wide-sweep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print repository check failure
        shell: bash
        run: |
          set +e
          npm run check > /tmp/wide-sweep-check.txt 2>&1
          code=$?
          echo "CHECK_EXIT_CODE=$code"
          tail -n 300 /tmp/wide-sweep-check.txt
          exit 0
