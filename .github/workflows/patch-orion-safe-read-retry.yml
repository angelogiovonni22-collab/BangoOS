name: Patch Orion Safe Read Retry

on:
  push:
    branches:
      - feat/orion-safe-read-retry-20260905
    paths:
      - scripts/patch-orion-safe-read-retry.py
      - .github/workflows/patch-orion-safe-read-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-safe-read-retry-20260905
      - run: python scripts/patch-orion-safe-read-retry.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/orion/autonomy/safe-read-executor.ts lib/orion/autonomy/orion-safe-read-retry.contract.test.ts
          git diff --cached --quiet || git commit -m "Retry transient Orion safe-read failures"
          git push
