name: Blueprint Modal Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Modal credentials exist
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo "MODAL_TOKEN_ID is not configured" && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "MODAL_TOKEN_SECRET is not configured" && exit 1)

      - name: Install Modal
        run: python -m pip install "modal>=1.5,<2"

      - name: Deploy Blueprint inference service
        run: modal deploy services/blueprint-inference/modal_app.py --name bos-blueprint-inference --strategy rolling
