name: BOSApp
options:
  bundleIdPrefix: com.bango
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  BOSApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../BOSRealityCapture
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: B.O.S.
        UILaunchScreen: {}
        NSCameraUsageDescription: B.O.S. uses the camera for Reality Engine room capture and project documentation.
        NSPhotoLibraryUsageDescription: B.O.S. can attach project photos and Reality Engine capture assets.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BOS_IOS_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(BOS_APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
